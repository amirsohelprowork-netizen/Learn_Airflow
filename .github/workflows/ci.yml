name: CI & DAG Governance Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 1. DAG Governance & Cluster Policy Test Suite
  # ============================================================================
  dag-governance:
    name: DAG Governance & Policy Tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python Files
        run: |
          python3 -m py_compile config/*.py dags/**/*.py scripts/*.py tests/*.py

      - name: Run CI/CD DAG Governance & Policy Tests
        run: |
          python3 -m unittest discover tests -v

  # ============================================================================
  # 2. Shell Scripts Syntax & Quality Validation
  # ============================================================================
  shell-scripts:
    name: Shell Scripts Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Bash Script Syntax
        run: |
          echo "Checking syntax across control CLI and helper scripts..."
          bash -n ctl scripts/*.sh
          echo "All bash scripts passed syntax check."

  # ============================================================================
  # 3. Terraform IaC Format & Validation Gate
  # ============================================================================
  terraform:
    name: Terraform Format & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Check Terraform Formatting
        run: |
          terraform -chdir=terraform fmt -check -recursive

      - name: Initialize Terraform (Stateless)
        run: |
          terraform -chdir=terraform init -backend=false

      - name: Validate Terraform Configuration
        run: |
          terraform -chdir=terraform validate

  # ============================================================================
  # 4. Kubernetes Manifests & Helm Values Lint
  # ============================================================================
  k8s-manifests:
    name: Kubernetes & Helm YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Parse & Validate Kubernetes YAML Manifests
        run: |
          python3 -c "
          import yaml, glob, sys
          failed = False
          files = glob.glob('k8s/**/*.yaml', recursive=True) + ['values.yaml']
          for p in files:
              try:
                  with open(p, 'r', encoding='utf-8') as f:
                      list(yaml.safe_load_all(f))
              except Exception as err:
                  print(f'Error parsing {p}: {err}', file=sys.stderr)
                  failed = True
          if failed:
              sys.exit(1)
          print(f'Successfully validated {len(files)} YAML manifests.')
          "
