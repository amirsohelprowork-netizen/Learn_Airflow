name: Local Platform Quality Gate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  runtime:
    name: Build and test the actual Airflow runtime
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned runtime with bundled DAGs and providers
        run: docker build -t learn-airflow:ci .
      - name: Require real DAG imports and failure regression tests
        run: >-
          docker run --rm --entrypoint python3 -e AIRFLOW_REQUIRE_RUNTIME=1
          -e PYTHONPATH=/opt/airflow/config learn-airflow:ci
          -m unittest discover /opt/airflow/tests -v
      - name: Gate fixable high and critical runtime vulnerabilities
        run: ./scripts/scan.sh learn-airflow:ci
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install PyYAML==6.0.2
      - name: Validate each shell script and Python syntax
        run: |
          for file in ctl scripts/*.sh; do bash -n "$file"; done
          python3 -m compileall -q config dags scripts tests
      - name: Render and check the pinned Airflow chart
        run: ./scripts/validate-manifests.sh
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform init -backend=false -input=false
      - run: terraform -chdir=terraform validate
