apiVersion: v1
kind: Service
metadata:
  name: s3
  namespace: airflow
spec:
  ports:
    - name: http
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
apiVersion: v1
kind: Endpoints
metadata:
  name: s3
  namespace: airflow
subsets:
  - addresses:
      - ip: 172.18.0.1
    ports:
      - name: http
        port: 9000
      - name: console
        port: 9001
