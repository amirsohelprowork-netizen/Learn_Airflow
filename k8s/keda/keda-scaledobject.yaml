apiVersion: v1
kind: Secret
metadata:
  name: airflow-keda-db-secret
  namespace: airflow
stringData:
  connection: "postgresql://airflow:airflow@postgres.airflow.svc.cluster.local:5432/airflow?sslmode=disable"
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: keda-trigger-auth-db
  namespace: airflow
spec:
  secretTargetRef:
    - parameter: connection
      name: airflow-keda-db-secret
      key: connection
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: airflow-worker
  namespace: airflow
  labels:
    tier: airflow
    component: worker-horizontalpodautoscaler
    deploymentName: airflow-worker
spec:
  scaleTargetRef:
    kind: StatefulSet
    name: airflow-worker
  pollingInterval: 5
  cooldownPeriod: 30
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
    - type: postgresql
      metadata:
        targetQueryValue: "1"
        query: "SELECT ceil(COUNT(*)::decimal / 16) FROM task_instance WHERE (state='running' OR state='queued') AND queue IN ('default')"
      authenticationRef:
        name: keda-trigger-auth-db
