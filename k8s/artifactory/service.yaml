apiVersion: v1
kind: Service
metadata:
  name: artifactory
  namespace: airflow
spec:
  ports:
    - name: http
      port: 8085
      targetPort: 8085
    - name: docker
      port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Endpoints
metadata:
  name: artifactory
  namespace: airflow
subsets:
  - addresses:
      - ip: 172.18.0.1
    ports:
      - name: http
        port: 8085
      - name: docker
        port: 5000
