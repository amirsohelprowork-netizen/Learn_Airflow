apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: airflow
spec:
  ports:
    - name: tcp-redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: Endpoints
metadata:
  name: redis
  namespace: airflow
subsets:
  - addresses:
      - ip: 172.18.0.1
    ports:
      - name: tcp-redis
        port: 6379
