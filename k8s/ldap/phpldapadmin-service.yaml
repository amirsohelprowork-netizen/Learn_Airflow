apiVersion: v1
kind: Service
metadata:
  name: phpldapadmin
  namespace: airflow
spec:
  ports:
    - name: http
      port: 80
      targetPort: 8082
---
apiVersion: v1
kind: Endpoints
metadata:
  name: phpldapadmin
  namespace: airflow
subsets:
  - addresses:
      - ip: 172.18.0.1
    ports:
      - name: http
        port: 8082
