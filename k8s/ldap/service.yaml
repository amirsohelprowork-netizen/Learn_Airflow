apiVersion: v1
kind: Service
metadata:
  name: openldap
  namespace: airflow
spec:
  ports:
    - name: ldap
      port: 389
      targetPort: 389
---
apiVersion: v1
kind: Endpoints
metadata:
  name: openldap
  namespace: airflow
subsets:
  - addresses:
      - ip: 172.18.0.1
    ports:
      - name: ldap
        port: 389
