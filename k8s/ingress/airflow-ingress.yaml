apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: airflow-ingress
  namespace: airflow
  annotations:
    cert-manager.io/cluster-issuer: "airflow-ca-issuer"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - airflow.local
        - airflow.172.18.0.2.nip.io
      secretName: airflow-tls-secret
    - hosts:
        - auth.local
        - auth.172.18.0.2.nip.io
      secretName: keycloak-tls-secret
    - hosts:
        - flower.local
        - flower.172.18.0.2.nip.io
      secretName: flower-tls-secret
    - hosts:
        - vault.local
        - vault.172.18.0.2.nip.io
      secretName: vault-tls-secret
    - hosts:
        - minio.local
        - minio.172.18.0.2.nip.io
      secretName: minio-tls-secret
    - hosts:
        - ldap.local
        - ldap.172.18.0.2.nip.io
      secretName: ldap-tls-secret
    - hosts:
        - artifactory.local
        - artifactory.172.18.0.2.nip.io
      secretName: artifactory-tls-secret
  rules:
    # Airflow UI & API
    - host: airflow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: airflow-api-server
                port:
                  number: 8080
    - host: airflow.172.18.0.2.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: airflow-api-server
                port:
                  number: 8080

    # Keycloak SSO
    - host: auth.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
    - host: auth.172.18.0.2.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080

    # Flower Celery Monitor
    - host: flower.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: airflow-flower
                port:
                  number: 5555
    - host: flower.172.18.0.2.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: airflow-flower
                port:
                  number: 5555

    # HashiCorp Vault UI
    - host: vault.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vault
                port:
                  number: 8200
    - host: vault.172.18.0.2.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vault
                port:
                  number: 8200

    # MinIO S3 Console
    - host: minio.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: s3
                port:
                  number: 9001
    - host: minio.172.18.0.2.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: s3
                port:
                  number: 9001

    # phpLDAPadmin
    - host: ldap.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: phpldapadmin
                port:
                  number: 80
    - host: ldap.172.18.0.2.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: phpldapadmin
                port:
                  number: 80

    # Artifactory (Nexus 3 OSS) Console & API
    - host: artifactory.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: artifactory
                port:
                  number: 8085
    - host: artifactory.172.18.0.2.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: artifactory
                port:
                  number: 8085
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: observability-ingress
  namespace: observability
  annotations:
    cert-manager.io/cluster-issuer: "airflow-ca-issuer"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - grafana.local
        - grafana.172.18.0.2.nip.io
      secretName: grafana-tls-secret
    - hosts:
        - prometheus.local
        - prometheus.172.18.0.2.nip.io
      secretName: prometheus-tls-secret
  rules:
    # Grafana Dashboard
    - host: grafana.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
    - host: grafana.172.18.0.2.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000

    # Prometheus UI
    - host: prometheus.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
    - host: prometheus.172.18.0.2.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prometheus
                port:
                  number: 9090
