apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus-datasource
        type: prometheus
        access: proxy
        url: http://prometheus.observability.svc.cluster.local:9090
        isDefault: true
        jsonData:
          timeInterval: 5s
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: observability
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'Airflow Dashboards'
        orgId: 1
        folder: 'Airflow'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  namespace: observability
data:
  alerting.yaml: |
    apiVersion: 1
    contactPoints:
      - orgId: 1
        name: email-admin
        receivers:
          - uid: email-admin-receiver
            type: email
            settings:
              addresses: alerts@local.test
              singleEmail: true
    policies:
      - orgId: 1
        receiver: email-admin
        group_by: ['alertname', 'grafana_folder']
        group_wait: 10s
        group_interval: 30s
        repeat_interval: 1h
    groups:
      - orgId: 1
        name: AirflowAlertRules
        folder: Airflow Alerts
        interval: 30s
        rules:
          - uid: airflow-scheduler-down
            title: AirflowSchedulerDown
            condition: B
            data:
              - refId: A
                queryType: ''
                relativeTimeRange:
                  from: 120
                  to: 0
                datasourceUid: prometheus-datasource
                model:
                  editorMode: code
                  expr: sum(rate(airflow_scheduler_heartbeat[1m])) or vector(0)
                  intervalMs: 1000
                  maxDataPoints: 43200
                  range: false
                  instant: true
                  refId: A
              - refId: B
                queryType: ''
                relativeTimeRange:
                  from: 120
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0.1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    name: Expression
                    type: __expr__
                    uid: __expr__
                  expression: A
                  refId: B
                  type: threshold
            noDataState: Alerting
            execErrState: Alerting
            for: 1m
            annotations:
              summary: "Airflow Scheduler heartbeat is missing"
              description: "No heartbeat received from any Airflow scheduler for more than 1 minute. Schedulers may be down or crashing."
            labels:
              severity: critical
          - uid: airflow-dag-import-errors
            title: AirflowDagImportErrors
            condition: B
            data:
              - refId: A
                queryType: ''
                relativeTimeRange:
                  from: 120
                  to: 0
                datasourceUid: prometheus-datasource
                model:
                  editorMode: code
                  expr: sum(airflow_dag_processing_import_errors) or vector(0)
                  intervalMs: 1000
                  maxDataPoints: 43200
                  range: false
                  instant: true
                  refId: A
              - refId: B
                queryType: ''
                relativeTimeRange:
                  from: 120
                  to: 0
                datasourceUid: __expr__
                model:
                  conditions:
                    - evaluator:
                        params:
                          - 0
                        type: gt
                      operator:
                        type: and
                      query:
                        params:
                          - A
                      reducer:
                        params: []
                        type: last
                      type: query
                  datasource:
                    name: Expression
                    type: __expr__
                    uid: __expr__
                  expression: A
                  refId: B
                  type: threshold
            noDataState: OK
            execErrState: Error
            for: 1m
            annotations:
              summary: "Airflow DAG processing import errors detected"
              description: "DAG processor has detected syntax or import errors in one or more DAG files."
            labels:
              severity: warning
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-airflow-dashboard
  namespace: observability
data:
  airflow-overview.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": true,
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 100,
          "title": "Scheduler & Executor Health",
          "type": "row"
        },
        {
          "id": 1,
          "title": "Scheduler Heartbeat Status",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "targets": [
            {
              "expr": "sum(rate(airflow_scheduler_heartbeat[1m])) or vector(0)",
              "legendFormat": "Heartbeats/sec",
              "refId": "A"
            }
          ],
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"] },
            "colorMode": "value"
          }
        },
        {
          "id": 2,
          "title": "Executor Open Slots",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "targets": [
            {
              "expr": "sum(airflow_executor_open_slots) or vector(16)",
              "legendFormat": "Slots",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "Queued Tasks",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "targets": [
            {
              "expr": "sum(airflow_executor_queued_tasks) or vector(0)",
              "legendFormat": "Queued",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "Running Tasks",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "targets": [
            {
              "expr": "sum(airflow_executor_running_tasks) or vector(0)",
              "legendFormat": "Running",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 101,
          "title": "Task & DAG Execution Trends",
          "type": "row"
        },
        {
          "id": 5,
          "title": "Task Instances by State",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "targets": [
            {
              "expr": "sum by (state) (rate(airflow_ti_finish[5m])) or sum by (status) (airflow_dagrun_dependency_check)",
              "legendFormat": "{{state}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Scheduler Loop & DagBag Duration (s)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "targets": [
            {
              "expr": "airflow_dag_processing_total_parse_time or rate(airflow_dag_processing_manager_stalls_total[5m])",
              "legendFormat": "Parse Time",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["airflow", "kubernetes"],
      "time": { "from": "now-15m", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Airflow Production Overview",
      "uid": "airflow-overview",
      "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels:
    app: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      securityContext:
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin-secret
                  key: password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
            - name: GF_SMTP_ENABLED
              value: "true"
            - name: GF_SMTP_HOST
              value: "mailpit.airflow.svc.cluster.local:1025"
            - name: GF_SMTP_FROM_ADDRESS
              value: "alerts@local.test"
            - name: GF_SMTP_FROM_NAME
              value: "Airflow Platform Alert"
            - name: GF_SMTP_STARTTLS_POLICY
              value: "NoStartTLS"
            - name: GF_UNIFIED_ALERTING_ENABLED
              value: "true"
          readinessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: 3000}
            initialDelaySeconds: 30
          ports:
            - name: http
              containerPort: 3000
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: airflow-dashboard
              mountPath: /var/lib/grafana/dashboards
            - name: alerting
              mountPath: /etc/grafana/provisioning/alerting
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboards-provider
        - name: airflow-dashboard
          configMap:
            name: grafana-airflow-dashboard
        - name: alerting
          configMap:
            name: grafana-alerting
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
  labels:
    app: grafana
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
  selector:
    app: grafana

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  namespace: observability
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
