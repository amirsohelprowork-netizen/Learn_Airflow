apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: airflow
spec:
  ports:
    - name: http
      port: 8200
      targetPort: 8200
---
apiVersion: v1
kind: Endpoints
metadata:
  name: vault
  namespace: airflow
subsets:
  - addresses:
      - ip: 172.18.0.1
    ports:
      - name: http
        port: 8200
