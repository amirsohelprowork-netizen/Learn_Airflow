# Local production-like profile. Pin chart 1.22.0 in every install command.
# The content-addressed image tag is supplied by scripts/deploy-airflow.sh.
airflowVersion: "3.3.2"
defaultAirflowRepository: learn-airflow
defaultAirflowTag: local-build-required
images:
  airflow:
    repository: learn-airflow
    tag: local-build-required
    pullPolicy: IfNotPresent
uid: 50000
gid: 0
securityContexts:
  pod:
    runAsNonRoot: true
    runAsUser: 50000
    fsGroup: 0
  containers:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    seccompProfile:
      type: RuntimeDefault
executor: CeleryExecutor
enableServiceLinks: false
apiSecretKeySecretName: airflow-api-secret
fernetKeySecretName: airflow-fernet-secret
jwtSecretName: airflow-jwt-secret
config:
  core:
    dags_are_paused_at_creation: "True"
    load_examples: "False"
    auth_manager: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    parallelism: 12
    max_active_tasks_per_dag: 4
    max_active_runs_per_dag: 1
    execution_api_server_url: http://airflow-api-server.airflow.svc.cluster.local:8080/execution/
  secrets:
    backend: airflow.providers.hashicorp.secrets.vault.VaultBackend
    backend_kwargs: '{"url":"https://vault.airflow.svc.cluster.local:8200","auth_type":"kubernetes","kubernetes_role":"airflow","mount_point":"secret","kv_engine_version":2,"variables_path":null,"connections_path":"airflow/connections","config_path":null,"verify":"/opt/airflow/tls/ca.crt"}'
  metrics:
    statsd_on: "True"
    statsd_host: airflow-statsd
    statsd_port: 9125
    statsd_prefix: airflow
  celery:
    worker_concurrency: 2
    worker_prefetch_multiplier: 1
    task_acks_late: "True"
  logging:
    logging_level: INFO
    remote_logging: "True"
    remote_log_conn_id: aws_default
    remote_base_log_folder: s3://airflow-logs
  api:
    base_url: https://localhost
extraEnv: |
  - name: PYTHONPATH
    value: /opt/airflow/config
  - name: AIRFLOW_ALERT_EMAIL
    value: alerts@local.test
  - name: KEYCLOAK_INTERNAL_URL
    value: https://keycloak.airflow.svc.cluster.local:8443
  - name: REQUESTS_CA_BUNDLE
    value: /opt/airflow/tls/ca.crt
extraEnvFrom: |
  - secretRef:
      name: airflow-runtime-secret
volumes:
  - name: local-ca
    secret:
      secretName: airflow-ca
volumeMounts:
  - name: local-ca
    mountPath: /opt/airflow/tls
    readOnly: true
airflowLocalSettings: ~
webserver:
  enabled: false
ingress:
  web:
    enabled: false
networkPolicies:
  enabled: true
apiServer:
  replicas: 2
  podDisruptionBudget:
    enabled: true
    config:
      maxUnavailable: 1
  service:
    type: ClusterIP
  networkPolicy:
    ingress:
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-system
        - podSelector:
            matchLabels:
              tier: airflow
              release: airflow
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 1000m, memory: 1Gi}
scheduler:
  replicas: 2
  podDisruptionBudget:
    enabled: true
    config:
      maxUnavailable: 1
  resources:
    requests: {cpu: 150m, memory: 384Mi}
    limits: {cpu: 1000m, memory: 1Gi}
dagProcessor:
  enabled: true
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 1000m, memory: 1Gi}
workers:
  celery:
    replicas: 1
    persistence:
      enabled: false
    podDisruptionBudget:
      enabled: true
      config:
        minAvailable: 1
    keda:
      enabled: true
      minReplicaCount: 1
      maxReplicaCount: 3
      pollingInterval: 15
      cooldownPeriod: 120
    resources:
      requests: {cpu: 150m, memory: 384Mi}
      limits: {cpu: 1000m, memory: 1536Mi}
triggerer:
  enabled: true
  replicas: 1
  persistence:
    enabled: false
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 768Mi}
# OIDC administrator is imported into Keycloak; avoid a second password in Helm history.
createUserJob:
  enabled: false
migrateDatabaseJob:
  enabled: false
dags:
  persistence:
    enabled: false
  gitSync:
    enabled: false
    recommendedProbeSetting: true
logs:
  persistence:
    enabled: false
postgresql:
  enabled: false
redis:
  enabled: false
data:
  metadataSecretName: airflow-metadata-secret
  resultBackendSecretName: airflow-result-backend-secret
  brokerUrlSecretName: airflow-broker-secret
flower:
  enabled: false
# Bound maintenance work; preserves recent history.
databaseCleanup:
  enabled: true
  retentionDays: 30
